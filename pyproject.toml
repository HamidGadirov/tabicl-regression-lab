[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabicl-regression-lab"
version = "0.1.0"
description = "Small reproducible experiments in tabular regression with TabICLv2"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hamid Gadirov"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
model = ["tabicl==2.2.0"]

[project.scripts]
tabicl-lab = "tabicl_lab.experiment:main"

[tool.setuptools.packages.find]
include = ["tabicl_lab*"]
